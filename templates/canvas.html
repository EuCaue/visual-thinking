<!--
  visual-thinking :: canvas template (composable visual reasoning canvas)
  Fill ONLY: <title> above and the JSON inside <script id="scene">. Schema: formats.md, "canvas".
  A scene is one or more views; a view is a layout of blocks: chart, matrix, cards, timeline, steps, tree, quadrant,
  spectrum, cycle, funnel, venn, kpi, callout, text, free, graph. The runtime measures, lays out, draws and animates.
-->
<style>
/* TOKENS:BEGIN  (source of truth: templates/_tokens.css; synced into each template by scripts/sync-tokens.py)
   Design system of visual-thinking. Semantic tokens only; components never use literal colors.
   Light is the base; dark redefines the same tokens. Both tested for contrast (design.md). */
:root {
  /* type */
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;
  --lh-tight: 1.25; --lh-body: 1.5;
  --track-caps: 0.05em;

  /* space (4px base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;

  /* shape: one radius scale */
  --r-control: 8px; --r-node: 10px; --r-panel: 14px;

  /* surfaces */
  --bg: #f6f7f9;            /* page ground, cool off-white */
  --bg-elev: #ffffff;       /* panels */
  --bg-inset: #eceff3;      /* wells, chips, group boxes */
  --line: #e1e5eb;          /* hairlines */
  --line-strong: #aeb7c4;   /* borders that must read */

  /* text */
  --fg: #171a20;
  --fg-muted: #5a6373;      /* ≥ 4.5:1 on --bg and --bg-elev */
  --fg-faint: #7c8696;      /* large text or non-essential only */

  /* accent: one hue, used for selection, focus, links, control edges */
  --accent: #2f5fc7;
  --accent-fg: #ffffff;
  --accent-soft: #e4ebfa;
  --focus: #2f5fc7;

  /* semantic state */
  --ok: #257a4c;  --ok-soft: #e1f2e8;
  --warn: #9a6207; --warn-soft: #f8edd5;
  --danger: #b5382f; --danger-soft: #f9e3e0;

  /* diagram: node kinds (fill, stroke) */
  --n-entry-fill: var(--ok-soft);       --n-entry-stroke: var(--ok);
  --n-component-fill: var(--accent-soft); --n-component-stroke: var(--accent);
  --n-external-fill: var(--bg-inset);   --n-external-stroke: var(--line-strong);
  --n-store-fill: var(--warn-soft);     --n-store-stroke: var(--warn);
  --n-decision-fill: var(--bg-elev);    --n-decision-stroke: var(--accent);
  --n-critical-fill: var(--danger-soft); --n-critical-stroke: var(--danger);
  --n-group-fill: #ffffff;              --n-group-stroke: var(--line);

  /* diagram: edge kinds */
  --e-data: var(--warn);
  --e-control: var(--accent);
  --e-event: var(--ok);
  --e-error: var(--danger);
  --e-muted: var(--line-strong);

  /* data series: six hues with distinct lightness so they survive grayscale; s1 = accent */
  --s1: #2f5fc7; --s2: #d2691e; --s3: #257a4c; --s4: #8a4fbf; --s5: #b5382f; --s6: #6b7280;
  --grid: #e8ebf0;          /* chart gridlines, lighter than hairlines */

  /* motion: one ease, three durations. Transitions start from the current value and stay interruptible. */
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --d-fast: 120ms; --d-base: 200ms; --d-slow: 320ms;
  --t-fast: var(--d-fast) var(--ease);
  --t-base: var(--d-base) var(--ease);
  --t-slow: var(--d-slow) var(--ease);

  /* floating chrome: translucent material over the canvas, one shadow with offset and blur */
  --chrome: rgba(255, 255, 255, 0.78);
  --shadow-float: 0 1px 2px rgba(16, 24, 40, 0.05), 0 8px 24px rgba(16, 24, 40, 0.07);

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --bg-elev: #161a20; --bg-inset: #1d222a;
    --line: #242a33; --line-strong: #4a5363;
    --chrome: rgba(22, 26, 32, 0.78); --shadow-float: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    --fg: #e7eaef; --fg-muted: #a3acba; --fg-faint: #7f8896;
    --accent: #8fb0f3; --accent-fg: #0f1216; --accent-soft: #1d2a44; --focus: #8fb0f3;
    --ok: #6cc695; --ok-soft: #16301f;
    --warn: #e0b35a; --warn-soft: #332a12;
    --danger: #ef8a7f; --danger-soft: #3a1c19;
    --n-group-fill: #13171d;
    --s1: #8fb0f3; --s2: #f0a060; --s3: #6cc695; --s4: #c39bea; --s5: #ef8a7f; --s6: #9aa3b0;
    --grid: #1f252d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --bg-elev: #161a20; --bg-inset: #1d222a;
  --line: #242a33; --line-strong: #4a5363;
  --chrome: rgba(22, 26, 32, 0.78); --shadow-float: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  --fg: #e7eaef; --fg-muted: #a3acba; --fg-faint: #7f8896;
  --accent: #8fb0f3; --accent-fg: #0f1216; --accent-soft: #1d2a44; --focus: #8fb0f3;
  --ok: #6cc695; --ok-soft: #16301f;
  --warn: #e0b35a; --warn-soft: #332a12;
  --danger: #ef8a7f; --danger-soft: #3a1c19;
  --n-group-fill: #13171d;
  --s1: #8fb0f3; --s2: #f0a060; --s3: #6cc695; --s4: #c39bea; --s5: #ef8a7f; --s6: #9aa3b0;
  --grid: #1f252d;
  color-scheme: dark;
}

/* base: browser surfaces carry the design too */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: var(--fs-md)/var(--lh-body) var(--font-ui); -webkit-font-smoothing: antialiased; transition: background-color var(--t-base), color var(--t-base); }
::selection { background: var(--accent-soft); color: var(--fg); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-control); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-data); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { :root { --d-fast: 0ms; --d-base: 0ms; --d-slow: 0ms; } * { animation: none !important; } }
@media (prefers-reduced-transparency: reduce) { :root { --chrome: var(--bg-elev); } }
/* TOKENS:END */

body { display: flex; flex-direction: column; }

.title-block { min-width: 0; flex: 1 1 auto; }

.seg { display: inline-flex; padding: 2px; background: var(--bg-inset); border-radius: var(--r-control); gap: 2px; flex: 0 0 auto; }
.seg button { background: transparent; border: 0; border-radius: calc(var(--r-control) - 2px); padding: 5px 12px; font-size: var(--fs-sm); color: var(--fg-muted); cursor: pointer; transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast); }
.seg button:hover { color: var(--fg); }
.seg button:active { transform: scale(0.97); }
.seg button[aria-selected="true"] { background: var(--bg-elev); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08); }
.btn { background: transparent; border: 0; border-radius: var(--r-control); padding: 5px 10px; font-size: var(--fs-sm); color: var(--fg-muted); cursor: pointer; transition: background var(--t-fast), color var(--t-fast), transform var(--t-fast); white-space: nowrap; }
.btn:hover { background: var(--bg-inset); color: var(--fg); }
.btn:active { transform: scale(0.97); }
.btn.primary { color: var(--fg); background: var(--bg-inset); }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.canvas-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; cursor: grab; touch-action: none; }
.canvas-wrap:active { cursor: grabbing; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.float { position: absolute; display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--chrome); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-radius: calc(var(--r-control) + 3px); box-shadow: var(--shadow-float); opacity: .92; transition: opacity var(--t-fast); }
.float:hover { opacity: 1; }

.search { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--r-control); padding: 5px 10px; font-size: var(--fs-sm); width: 180px; transition: border-color var(--t-fast), width var(--t-base), box-shadow var(--t-fast); }
.search::placeholder { color: var(--fg-faint); }

.tip.on { opacity: 1; transform: translateY(0); }
.tip .k { color: var(--fg-muted); } .tip .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; } .tip .t { font-weight: 600; margin-bottom: 2px; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

#detail { transition: opacity var(--t-fast), transform var(--t-base); } #detail.swap { opacity: 0; transform: translateY(4px); }
.name { font-size: var(--fs-lg); font-weight: 600; line-height: var(--lh-tight); letter-spacing: -0.01em; }
.sub2 { color: var(--fg-muted); margin-top: 3px; }
.file { font-family: var(--font-data); font-size: var(--fs-sm); color: var(--accent); word-break: break-all; margin-top: var(--sp-2); }
.prose { margin: 0; font-size: var(--fs-sm); line-height: var(--lh-body); max-width: 60ch; }
.empty { color: var(--fg-muted); font-size: var(--fs-sm); }
.tags { display: flex; gap: var(--sp-1); flex-wrap: wrap; margin-top: var(--sp-3); }
.tag { font-size: var(--fs-xs); padding: 2px 9px; border-radius: 999px; background: var(--bg-inset); color: var(--fg-muted); }
.tag.verified { color: var(--ok); background: var(--ok-soft); } .tag.inferred { color: var(--warn); background: var(--warn-soft); } .tag.unknown { color: var(--danger); background: var(--danger-soft); }
ul { margin: 0; padding-left: 18px; } li { margin: var(--sp-1) 0; font-size: var(--fs-sm); }
.rows { list-style: none; padding: 0; margin: 0; } .rows li { margin: 0; }
.rows button { display: flex; align-items: baseline; gap: var(--sp-2); width: 100%; text-align: left; background: none; border: 0; padding: 7px var(--sp-2); margin: 0 calc(-1 * var(--sp-2)); border-radius: var(--r-control); color: var(--fg); cursor: pointer; font-size: var(--fs-sm); transition: background var(--t-fast); }
.rows button:hover { background: var(--bg-inset); }
.rows b { font-weight: 500; } .rows code { color: var(--fg-muted); font-size: var(--fs-xs); } .rows .d { display: block; color: var(--fg-muted); font-size: var(--fs-xs); margin-top: 1px; } .rows .chev { margin-left: auto; color: var(--fg-faint); }
.rows i { display: block; width: 12px; height: 0; border-top: 2px solid; flex: 0 0 12px; position: relative; top: -3px; }
.row { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-4); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: var(--fs-sm); margin-top: var(--sp-3); } .kv dt { color: var(--fg-muted); } .kv dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 1fr) auto; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; padding: var(--sp-4); }
  .top { flex-wrap: wrap; padding: var(--sp-4); } .top .seg { order: 3; flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; } .top .seg::-webkit-scrollbar { display: none; } .top .seg button { white-space: nowrap; } .float.tl { right: var(--sp-5); } .search { width: 100%; }
}

/* ---------- drawing: every color is a token; theme change is pure CSS */
#world { transition: opacity var(--t-base); } #world.fade { opacity: 0; }
#canvas text { font-family: var(--font-ui); fill: var(--fg); pointer-events: none; }
#canvas .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
