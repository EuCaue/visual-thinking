/* ---------- blocks: entity (ERD), heatmap, gantt, sankey, treemap */
.er-box { fill: var(--bg-elev); stroke: var(--line-strong); stroke-width: 1; } .er-head { fill: var(--accent-soft); } .nd.sel .er-box { stroke: var(--accent); stroke-width: 2; }
.er-f { font-size: 11.5px; } .er-t { font-family: var(--font-data); font-size: 10.5px; fill: var(--fg-muted); } .er-pk { font-family: var(--font-data); font-size: 9.5px; font-weight: 700; fill: var(--accent); } .er-fk { font-family: var(--font-data); font-size: 9.5px; font-weight: 700; fill: var(--warn); }
.er-row:hover { fill: var(--bg-inset); } .er-row { fill: transparent; }
.hm-cell { fill: var(--c, var(--s1)); stroke: var(--bg-elev); stroke-width: 1; cursor: pointer; transition: stroke var(--t-fast); } .hm-cell:hover, .hm-cell.sel { stroke: var(--fg); stroke-width: 1.5; } .hm-empty { fill: var(--bg-inset); stroke: var(--bg-elev); stroke-width: 1; }
.hm-v { font-family: var(--font-data); font-size: 10px; font-variant-numeric: tabular-nums; pointer-events: none; }
.gt-bar { fill: var(--c, var(--s1)); opacity: .85; transition: opacity var(--t-fast); } .item:hover .gt-bar, .item.sel .gt-bar { opacity: 1; } .gt-prog { fill: var(--fg); opacity: .22; pointer-events: none; } .gt-ms { fill: var(--c, var(--s1)); }
.gt-dep { fill: none; stroke: var(--line-strong); stroke-width: 1.2; marker-end: url(#m-plain); } .gt-today { stroke: var(--danger); stroke-width: 1; stroke-dasharray: 3 3; } .gt-row { fill: var(--bg-inset); opacity: .45; }
.sk-link { fill: none; stroke: var(--c, var(--s1)); stroke-opacity: .32; cursor: pointer; transition: stroke-opacity var(--t-fast); } .sk-link:hover, .sk-link.hl { stroke-opacity: .6; } .sk-node { fill: var(--c, var(--s1)); }
.tm-cell { fill: var(--c, var(--s1)); stroke: var(--bg-elev); stroke-width: 1.5; cursor: pointer; } .tm-cell:hover, .item.sel .tm-cell { stroke: var(--fg); } .tm-l { font-size: 11px; font-weight: 600; pointer-events: none; } .tm-v { font-family: var(--font-data); font-size: 10px; pointer-events: none; }
/* code listing: token colors come from the theme */
.vt-code-bg { fill: var(--bg-inset); } .vt-code-hl { fill: var(--accent-soft); } .vt-code-dot { fill: var(--accent); }
.vt-code { position: relative; font-family: var(--font-data); font-size: 12px; line-height: 18px; color: var(--fg); }
.vt-code pre { margin: 0; padding: 0 12px 0 0; white-space: pre; overflow: hidden; font: inherit; } .vt-code code { font: inherit; background: none; }
.vt-code .ln { position: absolute; left: 0; top: 0; text-align: right; color: var(--fg-faint); user-select: none; } .vt-code .ln span { display: block; padding: 0 8px 0 4px; min-width: 2ch; } .vt-code .ln span.on { color: var(--accent); font-weight: 600; }
.hljs-keyword, .hljs-selector-tag, .hljs-doctag { color: var(--accent); } .hljs-string, .hljs-regexp, .hljs-addition, .hljs-template-tag { color: var(--ok); } .hljs-number, .hljs-literal, .hljs-symbol { color: var(--warn); }
.hljs-comment, .hljs-quote { color: var(--fg-faint); font-style: italic; } .hljs-title, .hljs-section { color: var(--s4); } .hljs-type, .hljs-built_in, .hljs-attr, .hljs-attribute, .hljs-params { color: var(--s2); } .hljs-meta, .hljs-tag { color: var(--fg-muted); } .hljs-deletion { color: var(--danger); }
/* math: MathML from KaTeX, sized by the text around it */
.vt-math { font-size: 17px; color: var(--fg); line-height: 1.4; } .vt-math-cap { font-size: var(--fs-sm); color: var(--fg-muted); margin-top: 6px; font-family: var(--font-ui); }
.vt-tex { font-family: var(--font-data); font-size: var(--fs-xs); background: var(--bg-inset); padding: 8px 10px; border-radius: var(--r-control); white-space: pre-wrap; margin: 0; }
/* map */
.map-r { stroke: var(--bg-elev); stroke-width: .8; cursor: pointer; } .map-empty { fill: var(--bg-inset); } .item:hover .map-r, .item.sel .map-r { stroke: var(--fg); stroke-width: 1.4; }

.map-l { font-size: 10px; font-weight: 600; fill: var(--fg); pointer-events: none; paint-order: stroke; stroke: var(--bg-elev); stroke-width: 3px; stroke-linejoin: round; } .map-pt { fill: var(--s5); fill-opacity: .65; stroke: var(--bg-elev); stroke-width: 1.2; cursor: pointer; } .item:hover .map-pt { fill-opacity: .9; }

.nk-tile { fill: var(--kc, var(--fg-muted)); stroke: none; } .nk { fill: none; stroke: #FFFFFF; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.k-entry { --kc: var(--k-entry, var(--ok)); } .k-component { --kc: var(--k-component, var(--accent)); } .k-store { --kc: var(--k-store, var(--warn)); } .k-queue { --kc: var(--k-queue, var(--warn)); } .k-external { --kc: var(--k-external, var(--fg-muted)); } .k-decision { --kc: var(--k-decision, var(--accent)); } .k-critical, .k-error { --kc: var(--danger); }
.kt { display: inline-grid; place-items: center; width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px; background: var(--kc, var(--fg-muted)); color: #FFFFFF; align-self: center; } span.kt > svg.ki { width: 13px; height: 13px; flex: 0 0 13px; color: #FFFFFF; } .name .kt { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 7px; } .name span.kt > svg.ki { width: 15px; height: 15px; }
