:root {
  /* type */
  --font-ui: system-ui, -apple-system, sans-serif;
  --font-data: monospace;
  --fs-xs: 12px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;

  /* space (4px base) */

  /* shape: one radius scale */

  /* surfaces */
  --bg: #F5F5F7;            /* page ground, Apple neutral */
  --bg-elev: #FFFFFF;       /* panels */
  --bg-inset: #F0F0F2;      /* wells, chips, group boxes */
  --line: #E5E5EA;          /* hairlines */
  --line-strong: #D2D2D7;   /* borders that must read */

  /* text */
  --fg: #1D1D1F;
  --fg-muted: #6A6A6F;      /* ≥ 4.5:1 on --bg and --bg-elev */
  --fg-faint: #86868B;      /* large text or non-essential only */

  /* accent: one hue, used for selection, focus, links, control edges */
  --accent: #0071E3;
  --accent-fg: #FFFFFF;
  --accent-soft: #E6F0FC;
  --focus: #0071E3;

  /* semantic state */
  --ok: #1E7B35;
  --ok-soft: #E4EFE7;
  --warn: #B25000;
  --warn-soft: #F6EAE0;
  --danger: #D70015;
  --danger-soft: #FAE0E3;

  /* diagram: node kinds (fill, stroke) */
  --n-entry-fill: var(--bg-elev);       --n-entry-stroke: var(--line);
  --n-component-fill: var(--bg-elev); --n-component-stroke: var(--line);
  --n-external-fill: var(--bg-inset);   --n-external-stroke: var(--line-strong);
  --n-store-fill: var(--bg-elev);     --n-store-stroke: var(--line);
  --n-decision-fill: var(--bg-elev);    --n-decision-stroke: var(--line);
  --n-critical-fill: var(--bg-elev); --n-critical-stroke: var(--danger);
  --n-group-fill: #F5F5F7;           --n-group-stroke: var(--line-strong);

  /* diagram: edge kinds */
  --e-data: #76767B;

  --e-event: #8E8E93;
  --e-error: var(--danger);

  /* data series: six hues with distinct lightness so they survive grayscale; s1 = accent */

  color-scheme: light;
  /* node kinds: system colors, drawn as solid tiles with a white glyph */

  --k-component: #007AFF;
  --k-store: #FF9500;
  --k-queue: #30B0C7;
  --k-external: #8E8E93;

          sumWS += w * s;

    }

    function rankOpts(calc) {
